<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Love Story Globe</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/compromise@12.3.0/builds/compromise.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .explainer {
            position: absolute;
            top: 30px;
            left: 30px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 25px;
            max-width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #fff;
        }

        p {
            color: #999;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .visualization-container {
            width: 100%;
            height: 100%;
        }

        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="explainer">
        <h1>Modern Love Stories</h1>
        <p>Explore a collection of New York Times Modern Love stories mapped across the world. Each red point represents a location mentioned in these compelling narratives of love, loss, and human connection.</p>
    </div>
    <div class="visualization-container">
        <div id="info"></div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
