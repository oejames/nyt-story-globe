<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Love Story Globe</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/compromise@12.3.0/builds/compromise.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .side-panel {
            width: 200px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-panel h1 {
            font-size: 24px;
            color: #ffffff;
            line-height: 1.2;
        }

        .side-panel p {
            font-size: 14px;
            line-height: 1.5;
            color: #999;
        }

        .stat-box {
            background-color: rgba(45, 45, 45, 0.95);
            padding: 15px;
            border-radius: 4px;
        }

        .stat-label {
            font-size: 14px;
            color: #fff;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            color: #FFD700;
            font-weight: bold;
        }

        .instructions {
            margin-top: auto;
            color: #999;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .instructions img {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .visualization-container {
            flex: 1;
            position: relative;
            background-color: #000;
        }

        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            display: none;
            z-index: 1000;
        }

        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="side-panel">
        <h1>Modern Love Stories</h1>
        <p>Explore a collection of New York Times Modern Love stories mapped across the world. Each red point represents a location mentioned in these compelling narratives of love, loss, and human connection.</p>
        
        <div class="stat-box">
            <div class="stat-label">Stories Mapped</div>
            <div class="stat-value">126</div>
        </div>
        
        <div class="stat-box">
            <div class="stat-label">Countries Featured</div>
            <div class="stat-value">43</div>
        </div>

        <div class="instructions">
            🌍 Drag to rotate the globe
        </div>
        <main class="visualization-container">
            <div id="info"></div>
        </main>
    <script src="/js/app.js"></script>
</body>
</html>
