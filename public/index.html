<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Love Story Globe</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/compromise@12.3.0/builds/compromise.min.js"></script>
    <style>
        .header {
            position: fixed;
            top: 0;
            left: 10%;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .header-content {
            max-width: 800px;
            margin: 0 auto;
        }
        .legend {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #ccc;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>Modern Love Stories Around the Globe</h1>
            <p>Explore New York Times Modern Love columns mapped across the world. </p>
            <div class="legend">
                <!-- <div><span class="dot"></span>Story Location</div> -->
                <!-- <div>🖱️ Double click to read story</div> -->
                <!-- <div>🔄 Drag to rotate • Scroll to zoom</div> -->
                <div>🌍 Drag to rotate</div>
                <div>🖱️ Scroll to zoom</div>
                <div>💡 Double click to read the story</div>
            </div>
        </div>
    </div>
    <div id="info"></div>
    <script src="/js/app.js"></script>
</body>
</html>
