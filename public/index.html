<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Love Story Globe</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://db.onlinewebfonts.com/c/171d30888ae4dbce3d0224490887fb87?family=TiemposHeadline-Bold" rel="stylesheet"></link>
    <link href="https://db.onlinewebfonts.com/c/171d30888ae4dbce3d0224490887fb87?family=TiemposHeadline-Regular" rel="stylesheet"></link>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/compromise@12.3.0/builds/compromise.min.js"></script>
</head>
<body>
    <div class="header">
        <h1 style="font-size: 24px; margin-bottom: 10px;">Modern Love Stories</h1>
        <p style="font-size: 14px; line-height: 1.4; font-family: 'Times New Roman', Times, serif;">Explore New York Times Modern Love columns mapped across the world.</p>
        <div id="stats" class="stats-container">
            <div class="stat-box">
                <div class="stat-label">Stories Mapped</div>
                <div class="stat-value" id="story-count">145</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Countries Featured</div>
                <div class="stat-value" id="country-count">43</div>
            </div>
        </div>

        <div class="legend">
            <!-- <div>👆 Hover over points to read story titles</div> -->
            <!-- <div>🖱️ Click twice to read story</div> -->
            <div>🌍 Drag to rotate</div>
            <div>🖱️ Scroll to zoom</div>
            <div>💡 Double click to read the story</div>
        </div>
    </div>
    <div id="info"></div>
    <script type="module" src="/src/client/js/main.js"></script>
</body>
</html>
